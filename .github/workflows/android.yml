# 配置先: .github/workflows/android.yml
#
# GitHub-hosted runner には Android SDK が最初から入っているので、
# 手元に Android Studio が無くても APK が作れる。
# public リポジトリなら Actions は無料、private でも月 2000 分の無料枠内に収まる。
#
# 出来た APK は Actions の実行結果ページ下部 "Artifacts" からダウンロードして
# Android 端末に転送 → 提供元不明のアプリを許可 → インストール。

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: core tests + balance sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # :core は純粋 JVM モジュールなので Android SDK 無しで走る = 速い
      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Run balance simulation
        run: ./gradlew :sim:run --args="--runs 500 --seed 1" --quiet

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
          retention-days: 7

  build-apk:
    name: assemble debug APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zerosum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
